<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M.S. Toys &amp; Gifts | Hero animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== M.S. Toys & Gifts: "Block drop" hero animation (light pastel) ===== */
:root{
  --ink:#0d0f1a; --red:#e63946; --blue:#1f6fe0; --yellow:#ffc933;
  --cream:#fff9f2; --pink:#ffe3ea; --sky:#dceeff; --mint:#d9f5e6; --butter:#fff3c4;
  --muted:#4b5070; --wa:#a7f0c5;
  --b:clamp(92px,23vw,168px);                 /* size of one toy block */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:'Outfit','Poppins','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:grid;place-items:center;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:
  radial-gradient(60% 50% at 18% 12%,var(--pink),transparent 70%),
  radial-gradient(55% 45% at 88% 24%,var(--sky),transparent 70%),
  radial-gradient(60% 50% at 70% 100%,var(--mint),transparent 70%),
  radial-gradient(40% 35% at 6% 92%,var(--butter),transparent 70%),var(--cream)}
.blob{position:absolute;z-index:-1;border-radius:50%;filter:blur(36px);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
.blob.b1{width:34vmax;height:34vmax;background:var(--pink);left:-8vmax;top:-10vmax}
.blob.b2{width:28vmax;height:28vmax;background:var(--sky);right:-8vmax;top:18vh;animation-duration:20s;animation-delay:-6s}
.blob.b3{width:30vmax;height:30vmax;background:var(--mint);left:28vw;bottom:-18vmax;animation-duration:24s;animation-delay:-11s}
@keyframes drift{to{transform:translate3d(4vmax,3vmax,0) scale(1.08)}}

.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 20px 72px}

/* --- the two toy blocks --- */
.blocks{position:relative;display:flex;align-items:flex-end;gap:calc(var(--b)*.045);height:calc(var(--b)*1.5);padding-top:calc(var(--b)*.2);margin-bottom:calc(var(--b)*.34)}
.slot{position:relative;will-change:transform;transform-origin:50% 100%}
.par{will-change:transform}
.float{will-change:transform}
.block{position:relative;width:var(--b);height:var(--b);border:calc(var(--b)*.05) solid var(--ink);border-radius:calc(var(--b)*.18);box-shadow:calc(var(--b)*.08) calc(var(--b)*.08) 0 var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.block svg{display:block;width:100%;height:100%}
.block.m{background:var(--red);transform:rotate(-6deg)}
.block.s{background:var(--blue);transform:rotate(5deg) translateY(calc(var(--b)*.1))}
.block:focus-visible{outline:3px solid var(--blue);outline-offset:6px}
.gs{position:absolute;left:8%;right:-4%;bottom:calc(var(--b)*-.2);height:calc(var(--b)*.11);border-radius:50%;background:rgba(13,15,26,.22);filter:blur(5px);pointer-events:none}
.slot.s-slot .gs{bottom:calc(var(--b)*-.3)}
.star{position:absolute;right:calc(var(--b)*-.3);top:calc(var(--b)*.02);width:calc(var(--b)*.34);height:calc(var(--b)*.34);cursor:pointer}
.star svg{display:block;width:100%;height:100%;overflow:visible}

/* --- wordmark, slogan, button --- */
.wordmark{margin:0;font-weight:700;font-size:clamp(40px,10.5vw,104px);line-height:1.05;letter-spacing:-.01em;display:flex;justify-content:center;white-space:pre}
.l{display:inline-block;overflow:hidden;padding:.06em .01em .24em;margin:-.06em 0 -.24em}
.li{display:inline-block;will-change:transform}
.slogan{margin:clamp(14px,2.4vw,26px) 0 0;font-weight:500;text-transform:uppercase;font-size:clamp(11px,1.5vw,17px);letter-spacing:.34em;color:var(--muted);padding-left:.34em}
.cta{margin-top:clamp(24px,3.4vw,40px);display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border:2.5px solid var(--ink);border-radius:999px;background:var(--wa);color:var(--ink);font:700 1.05rem/1 'Outfit','Poppins',sans-serif;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.cta:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.cta svg{width:20px;height:20px}
#fx{position:absolute;inset:0;z-index:3;pointer-events:none}
.snd{position:absolute;right:116px;bottom:16px;z-index:4;border:2px solid var(--ink);background:var(--butter);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .85rem 'Outfit','Poppins',sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.snd[aria-pressed=true]{background:var(--mint)}
.replay{position:absolute;right:16px;bottom:16px;z-index:4;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .85rem 'Outfit','Poppins',sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}

/* hidden until the intro starts (so nothing flashes at its final spot) */
.pre .slot,.pre .star,.pre .li,.pre .slogan,.pre .cta,.pre .gs{opacity:0}

/* --- idle motion after the intro --- */
.idle .float{animation:bob 3.6s ease-in-out infinite alternate}
.idle .s-slot .float{animation-duration:4.2s;animation-delay:-1.4s}
@keyframes bob{from{transform:translateY(0) rotate(0)}to{transform:translateY(-9px) rotate(1.4deg)}}
.idle .star svg{animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.16) rotate(14deg)}}

@media (prefers-reduced-motion:reduce){
  .blob,.idle .float,.idle .star svg{animation:none}
}
</style>
</head>
<body>

<!-- ============ PASTE THIS SECTION INTO YOUR WEBSITE (hero) ============ -->
<section class="hero pre" id="hero" aria-label="Welcome to M.S. Toys and Gifts">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="stage" id="stage">
    <div class="blocks" id="blocks">
      <div class="slot" id="slotM">
        <div class="gs"></div>
        <div class="par"><div class="float">
          <div class="block m" role="img" aria-label="Letter M toy block" tabindex="0">
            <svg viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(50 50) scale(1.12) translate(-50 -50)"><path d="M27 71 V31 L50 56 L73 31 V71" fill="none" stroke="#fff" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
          </div>
        </div></div>
      </div>
      <div class="slot s-slot" id="slotS">
        <div class="gs"></div>
        <div class="par"><div class="float">
          <div class="block s" role="img" aria-label="Letter S toy block" tabindex="0">
            <svg viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(50 50) scale(1.12) translate(-50 -50)"><path d="M68 35 C61 24 32 24 32 38 C32 53 68 48 68 62 C68 77 39 77 30 65" fill="none" stroke="#fff" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
          </div>
        </div></div>
      </div>
      <div class="star" id="star" aria-hidden="true">
        <svg viewBox="-20 -20 40 40"><path d="M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18Z" fill="#ffc933" stroke="#0d0f1a" stroke-width="3.4" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <h1 class="wordmark" id="wordmark" aria-label="toys &amp; gifts"></h1>
    <p class="slogan" id="slogan">Little joys. Big smiles.</p>
    <a class="cta" id="cta" href="#" data-wa>
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d0f1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
      Chat on WhatsApp
    </a>
  </div>

  <button class="snd" id="snd" type="button" aria-pressed="false">🔊 Sound off</button>
  <button class="replay" id="replay" type="button">↻ Replay</button><!-- demo only: you can delete this line -->
</section>

<script>
/* ===== Block drop hero animation: no libraries, works by opening the file ===== */
(() => {
  const $ = (s) => document.querySelector(s);
  const hero = $('#hero'), stage = $('#stage'), blocksEl = $('#blocks'), wm = $('#wordmark');
  const slots = [$('#slotM'), $('#slotS')];
  const shadows = [...document.querySelectorAll('.gs')];
  const pars = [...document.querySelectorAll('.par')];
  const star = $('#star'), slogan = $('#slogan'), cta = $('#cta');
  const cv = $('#fx'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* wordmark: one clipped span per letter so each can rise separately */
  [...'toys & gifts'].forEach((ch) => {
    const o = document.createElement('span'); o.className = 'l'; o.setAttribute('aria-hidden', 'true');
    const n = document.createElement('span'); n.className = 'li';
    n.textContent = ch === ' ' ? ' ' : ch; o.appendChild(n); wm.appendChild(o);
  });
  const letters = [...wm.querySelectorAll('.li')];

  /* ---------- confetti + dust (canvas) ---------- */
  let W = 0, H = 0, raf = 0, last = 0; const parts = [];
  const COLORS = ['#e63946', '#1f6fe0', '#ffc933', '#ffb3c6', '#a7d8ff', '#b8f0d0', '#d9c8ff', '#ffd6a5'];
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), r = hero.getBoundingClientRect();
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  function burst(x, y, n, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.15, v = (5 + Math.random() * 9) * power;
      parts.push({ kind: 'c', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .24 + Math.random() * .08,
        w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
        c: COLORS[i % COLORS.length], shape: i % 3, life: 0, max: 100 + Math.random() * 60 });
    }
    kick();
  }
  function dust(x, y, w) {
    for (let i = 0; i < 8; i++) {
      const dir = i < 4 ? -1 : 1, spread = (i % 4 + 1) * w * .11;
      parts.push({ kind: 'd', x: x + dir * w * .25, y: y - 4, vx: dir * (1.2 + Math.random() * 1.4), vy: -.35 - Math.random() * .3,
        r: 5 + Math.random() * 5, grow: .55 + Math.random() * .3, life: 0, max: 38 + Math.random() * 10, ox: spread });
    }
    kick();
  }
  function tick(t) {
    const dt = Math.min((t - last) / 16.67, 2.5) || 1; last = t; ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt;
      if (p.life > p.max) { parts.splice(i, 1); continue; }
      const f = 1 - p.life / p.max;
      if (p.kind === 'd') {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.r += p.grow * dt;
        ctx.globalAlpha = f * .55; ctx.fillStyle = 'rgba(150,158,190,.55)';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      } else {
        p.vy += p.g * dt; p.vx *= .992; p.vy *= .992; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.life * .18));
        ctx.globalAlpha = Math.min(1, f * 2.2); ctx.fillStyle = p.c;
        if (p.shape === 0) ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        else if (p.shape === 1) { ctx.beginPath(); ctx.arc(0, 0, p.h * .62, 0, 6.283); ctx.fill(); }
        else { ctx.beginPath(); ctx.moveTo(0, -p.w * .6); ctx.lineTo(p.w * .45, 0); ctx.lineTo(0, p.w * .6); ctx.lineTo(-p.w * .45, 0); ctx.fill(); }
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }

  /* ---------- the intro timeline ---------- */
  const timers = []; const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const FALL = 1250, HIT = .46 * FALL;

  function drop(el, delay, dist, rot) {
    const ease = 'cubic-bezier(.55,0,.9,.6)', land = 'cubic-bezier(.2,.7,.3,1)';
    el.animate([
      { transform: `translateY(${-dist}px) rotate(${rot}deg) scale(1,1.08)`, easing: ease, offset: 0 },
      { transform: 'translateY(0) rotate(0deg) scale(1.14,.82)', easing: land, offset: .46 },
      { transform: 'translateY(-52px) rotate(0deg) scale(.96,1.05)', easing: ease, offset: .62 },
      { transform: 'translateY(0) scale(1.06,.93)', easing: land, offset: .74 },
      { transform: 'translateY(-16px) scale(1,1)', easing: ease, offset: .86 },
      { transform: 'translateY(0) scale(1,1)', offset: 1 }
    ], { duration: FALL, delay, fill: 'both' });
  }
  function ground(el, delay) {
    el.animate([
      { opacity: 0, transform: 'scale(.3)', offset: 0 },
      { opacity: 1, transform: 'scale(1)', offset: .46 },
      { opacity: .7, transform: 'scale(.82)', offset: .62 },
      { opacity: 1, transform: 'scale(1)', offset: .74 },
      { opacity: 1, transform: 'scale(1)', offset: 1 }
    ], { duration: FALL, delay, fill: 'both' });
  }
  function shake() {
    stage.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(6px)' }, { transform: 'translateY(-2px)' }, { transform: 'translateY(0)' }],
      { duration: 280, easing: 'ease-out' });
  }

  function intro() {
    timers.splice(0).forEach(clearTimeout); parts.length = 0; ctx.clearRect(0, 0, W, H);
    hero.classList.remove('idle'); hero.getAnimations({ subtree: true }).forEach((a) => a.cancel());
    fit();
    const hr = hero.getBoundingClientRect();
    const pts = slots.map((s) => { const r = s.getBoundingClientRect();
      return { x: r.left + r.width / 2 - hr.left, y: r.bottom - hr.top - r.height * .06, top: r.top - hr.top, w: r.width, h: r.height }; });
    hero.classList.remove('pre');
    playSound();

    const delays = [150, 480];
    slots.forEach((s, i) => {
      drop(s, delays[i], pts[i].top + pts[i].h + 60, i ? 30 : -30);
      ground(shadows[i], delays[i]);
      later(() => { dust(pts[i].x, pts[i].y, pts[i].w); shake(); }, delays[i] + HIT);
    });
    later(() => burst((pts[0].x + pts[1].x) / 2, pts[0].y - pts[0].h * .5, 90, 1), delays[1] + HIT + 40);

    star.animate([{ transform: 'scale(0) rotate(-120deg)', opacity: 0 }, { transform: 'scale(1.5) rotate(12deg)', opacity: 1, offset: .6 }, { transform: 'scale(1) rotate(0)', opacity: 1 }],
      { duration: 650, delay: 1250, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'both' });
    letters.forEach((l, i) => l.animate([{ transform: 'translateY(118%) rotate(9deg)' }, { transform: 'translateY(-7%) rotate(-1.5deg)', offset: .72 }, { transform: 'translateY(0) rotate(0)' }],
      { duration: 720, delay: 1500 + i * 58, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'both' }));
    slogan.animate([{ opacity: 0, letterSpacing: '.06em', transform: 'translateY(10px)' }, { opacity: 1, letterSpacing: '.34em', transform: 'translateY(0)' }],
      { duration: 1000, delay: 2350, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' });
    cta.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1.08)', offset: .7 }, { opacity: 1, transform: 'scale(1)' }],
      { duration: 600, delay: 2650, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'both' });
    later(() => hero.classList.add('idle'), 3400);
  }

  /* ---------- tilt with the mouse (soft, lerped) ---------- */
  let tx = 0, ty = 0, cx = 0, cy = 0, pl = 0;
  const depth = [12, 20];
  function par() {
    cx += (tx - cx) * .08; cy += (ty - cy) * .08;
    blocksEl.style.transform = `perspective(900px) rotateX(${-cy * 6}deg) rotateY(${cx * 9}deg)`;
    pars.forEach((p, i) => { p.style.transform = `translate3d(${cx * -depth[i]}px, ${cy * -depth[i] * .5}px, 0)`; });
    star.style.translate = `${cx * -30}px ${cy * -16}px`;
    wm.style.transform = `translate3d(${cx * 8}px, ${cy * 4}px, 0)`;
    pl = (Math.abs(tx - cx) > .001 || Math.abs(ty - cy) > .001) ? requestAnimationFrame(par) : 0;
  }
  hero.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    const r = hero.getBoundingClientRect(); tx = ((e.clientX - r.left) / r.width - .5) * 2; ty = ((e.clientY - r.top) / r.height - .5) * 2;
    if (!pl) pl = requestAnimationFrame(par);
  });
  hero.addEventListener('pointerleave', () => { tx = ty = 0; if (!pl) pl = requestAnimationFrame(par); });

  /* ---------- tap a block or the star: it hops and pops confetti ---------- */
  function hop(el, withDust) {
    const hr = hero.getBoundingClientRect(), r = el.getBoundingClientRect();
    el.animate([{ transform: 'translateY(0) scale(1,1)' }, { transform: 'translateY(-78px) scale(.94,1.1)', offset: .4 },
      { transform: 'translateY(0) scale(1.1,.88)', offset: .7 }, { transform: 'translateY(-10px) scale(1)', offset: .86 }, { transform: 'translateY(0) scale(1,1)' }],
      { duration: 640, easing: 'cubic-bezier(.3,.7,.4,1)' });
    later(() => { if (withDust) dust(r.left + r.width / 2 - hr.left, r.bottom - hr.top - r.height * .06, r.width); }, 260);
    burst(r.left + r.width / 2 - hr.left, r.top - hr.top + r.height * .2, 34, .8);
  }
  slots.forEach((s) => s.querySelector('.block').addEventListener('click', () => hop(s, true)));
  slots.forEach((s) => s.querySelector('.block').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hop(s, true); } }));
  star.addEventListener('click', () => {
    const hr = hero.getBoundingClientRect(), r = star.getBoundingClientRect();
    star.animate([{ transform: 'rotate(0) scale(1)' }, { transform: 'rotate(200deg) scale(1.5)', offset: .5 }, { transform: 'rotate(360deg) scale(1)' }], { duration: 700, easing: 'ease-in-out' });
    burst(r.left + r.width / 2 - hr.left, r.top + r.height / 2 - hr.top, 40, .9);
  });
